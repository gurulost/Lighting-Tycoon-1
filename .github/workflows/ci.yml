name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      EXPO_NO_TELEMETRY: "1"
      EXPO_PUBLIC_DOMAIN: "localhost:5000"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Asset guard
        run: npm run check:assets

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run check:types

      - name: Telemetry Audit
        run: npm run telemetry:audit

      - name: Format
        run: npm run check:format

      - name: Unit tests
        run: npm test

      - name: Deployment verifier tests
        run: node --test scripts/verify-deployment.test.mjs

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Web E2E tests
        run: npm run test:e2e

      - name: Production surface guard
        run: npm run test:e2e:production
