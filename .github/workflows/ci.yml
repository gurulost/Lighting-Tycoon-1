name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      EXPO_NO_TELEMETRY: "1"
      EXPO_PUBLIC_DOMAIN: "localhost:5000"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Asset guard
        run: npm run check:assets

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run check:types

      - name: Telemetry Audit
        run: npm run telemetry:audit

      - name: Format
        run: npm run check:format

      - name: Unit tests
        run: npm test

      - name: Deployment verifier tests
        run: node --test scripts/verify-deployment.test.mjs

      - name: Prefer the official HTTPS Ubuntu package mirror
        run: |
          # Azure's image-default mirror can stall browser font/library downloads.
          # Keep the same Ubuntu repositories and signature verification.
          if [ -f /etc/apt/apt-mirrors.txt ]; then
            sudo sed -i \
              -e 's|http://azure.archive.ubuntu.com/ubuntu|https://archive.ubuntu.com/ubuntu|g' \
              -e 's|http://archive.ubuntu.com/ubuntu|https://archive.ubuntu.com/ubuntu|g' \
              /etc/apt/apt-mirrors.txt
          fi

      - name: Install Playwright browsers
        timeout-minutes: 7
        run: npx playwright install --with-deps chromium

      - name: Web E2E tests
        run: npm run test:e2e

      - name: Production surface guard
        run: npm run test:e2e:production
