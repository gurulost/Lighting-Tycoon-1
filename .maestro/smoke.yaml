appId: com.lightingtycoon.app
---
- launchApp:
    clearState: true
- extendedWaitUntil:
    visible:
      id: "e2e-skip-phase2"
    timeout: 120000
- tapOn:
    text: "Skip to Phase 2 playtest scenario"
- extendedWaitUntil:
    visible:
      id: "phase2-intro-modal"
    timeout: 30000
- tapOn:
    id: "phase2-intro-continue"
- extendedWaitUntil:
    visible:
      id: "orders-modal"
    timeout: 30000
- tapOn:
    id: "orders-modal-close"
- assertVisible:
    id: "playtest-session-banner"
- tapOn:
    id: "workbench-station"
- tapOn:
    id: "supplier-tap-baron"
- tapOn:
    text: "Close Suppliers"
- pressKey: Home
- launchApp:
    stopApp: false
- extendedWaitUntil:
    visible:
      id: "playtest-session-banner"
    timeout: 60000
- tapOn:
    id: "playtest-banner-restart"
- extendedWaitUntil:
    visible:
      id: "phase2-intro-modal"
    timeout: 30000
- tapOn:
    id: "phase2-intro-continue"
- extendedWaitUntil:
    visible:
      id: "orders-modal"
    timeout: 30000
- tapOn:
    id: "orders-modal-close"
- assertVisible:
    id: "playtest-session-banner"
- tapOn:
    id: "playtest-banner-restore"
- extendedWaitUntil:
    notVisible:
      id: "playtest-session-banner"
    timeout: 30000
- tapOn:
    id: "settings-button"
- assertVisible: "Settings"
- tapOn: "Decrease sound effects volume"
- tapOn: "Increase sound effects volume"
- tapOn: "Close Settings"
